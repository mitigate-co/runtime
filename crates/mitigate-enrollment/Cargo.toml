[package]
name = "mitigate-enrollment"
description = "Bounded possession proofs for optional Mitigate Platform enrollment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
https = ["dep:ureq", "dep:log"]

[dependencies]
mitigate-egress = { path = "../mitigate-egress", version = "0.1.0" }
mitigate-json = { path = "../mitigate-json", version = "0.1.0" }
mitigate-secrets = { path = "../mitigate-secrets", version = "0.1.0" }
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
zeroize.workspace = true
tokio.workspace = true
ureq = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
