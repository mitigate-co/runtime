[advisories]
version = 2

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "BSD-3-Clause"]
confidence-threshold = 0.95
# Reviewed permissive transitive licenses; no global license-policy expansion.
# See ADR 0019. Retain their notices in the release license bundle.
exceptions = [
  { name = "borrow-or-share", version = "=0.2.4", allow = ["MIT-0"] },
  { name = "foldhash", version = "=0.2.0", allow = ["Zlib"] },
  # HTTPS enrollment, reviewed in ADR 0029; retain all upstream notices.
  { name = "ring", version = "=0.17.14", allow = ["ISC"] },
  { name = "rustls-webpki", version = "=0.103.15", allow = ["ISC"] },
  { name = "untrusted", version = "=0.9.0", allow = ["ISC"] },
  { name = "webpki-roots", version = "=1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
