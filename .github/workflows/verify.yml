name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup show active-toolchain
      - run: python scripts/verify-vendored-sqlite.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Verify enrollment interoperability with Node/OpenSSL
        shell: bash
        run: |
          cargo run -p mitigate-enrollment --example proof --locked > target/enrollment-fixture.json
          node scripts/verify-enrollment.mjs target/enrollment-fixture.json
      - name: Verify signed event interoperability with Node/OpenSSL
        shell: bash
        run: |
          cargo run -p mitigate-enrollment --example event_proof --locked > target/event-fixture.json
          node scripts/verify-event-proof.mjs target/event-fixture.json
          cargo run -p mitigate-enrollment --example event_proof --locked -- --inventory > target/inventory-fixture.json
          node scripts/verify-event-proof.mjs target/inventory-fixture.json --inventory
      - run: cargo run -p mitigate-egress --example outbox --locked
      - run: cargo run -p mitigate-egress --example reference_mapping --locked
      - run: cargo run --locked -- privacy self-test --json
      - run: cargo run --locked -- egress inspect --json
      - run: cargo run --locked -- registry lookup --catalog examples/registry/catalog.json --subject io.example/synthetic-server --json
      - run: cargo run --locked -- version --json
      - run: cargo run --locked -- config check --config examples/runtime.json --json
      - run: cargo run --locked -- mcp scan --root examples/scanner-project --json
      - run: cargo run --locked -p mitigate-mcp-fixture -- listener-contract
      - run: cargo run --locked -p mitigate-mcp-fixture -- upstream-contract
      - run: cargo run --locked -p mitigate-mcp-fixture -- schema-contract
      - run: cargo run --locked -p mitigate-mcp-fixture -- launch-config > target/fixture-launch.json
      - run: cargo run --locked -- mcp inspect --launch-config target/fixture-launch.json --allow-exec --snapshot target/fixture-snapshot.json --json
      - run: cargo run --locked -- mcp diff --before target/fixture-snapshot.json --after target/fixture-snapshot.json --json
      - run: cargo run --locked -- mcp inspect --launch-config target/fixture-launch.json --allow-exec --classification-overrides examples/classification-overrides.json --json
      - name: Verify actual CLI contracts
        shell: bash
        run: |
          cli=target/debug/mitigate
          if [ "$RUNNER_OS" = Windows ]; then cli="$cli.exe"; fi
          python scripts/verify-enrollment-terminal.py "$cli"
          cargo run --locked -p mitigate-mcp-fixture -- cli-contract "$cli"
          cargo run --locked -p mitigate-mcp-fixture -- gateway-contract "$cli"
          cargo run --locked -p mitigate-mcp-fixture -- audit-contract "$cli"
          cargo run --locked -p mitigate-mcp-fixture -- governance-contract "$cli"
          cargo run --locked -p mitigate-mcp-fixture -- offline-contract "$cli"
          python scripts/verify-policy.py "$cli"
          python scripts/verify-grants.py "$cli"
          python scripts/verify-approvals.py "$cli"
          python scripts/verify-controls.py "$cli"
          fixture=target/debug/mitigate-test-mcp
          if [ "$RUNNER_OS" = Windows ]; then fixture="$fixture.exe"; fi
          python scripts/verify-launch-review.py "$cli" "$fixture"
      - name: Compare policy decisions with OPA reference
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/opa" https://github.com/open-policy-agent/opa/releases/download/v1.21.0/opa_linux_amd64_static
          echo "5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9  $RUNNER_TEMP/opa" | sha256sum --check
          chmod +x "$RUNNER_TEMP/opa"
          python scripts/verify-policy.py target/debug/mitigate --opa "$RUNNER_TEMP/opa"
      - name: Verify native credentials on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked -p mitigate-secrets native_windows_record_uses_local_persistence -- --ignored
          target/debug/mitigate-test-mcp.exe secret-contract target/debug/mitigate.exe
          python scripts/verify-policy.py target/debug/mitigate.exe --native
          cargo run -p mitigate-enrollment --features https --example native_lifecycle --locked -- --allow-native-fixture --cli target/debug/mitigate.exe
          node scripts/verify-enrollment-cli.mjs target/debug/mitigate.exe
      - name: Verify native credentials on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        run: |
          original=$(security default-keychain -d user | tr -d '"' | xargs)
          keychain="$RUNNER_TEMP/mitigate-fixture.keychain-db"
          trap 'security default-keychain -d user -s "$original"; security delete-keychain "$keychain"' EXIT
          security create-keychain -p mitigate-ci-fixture "$keychain"
          security unlock-keychain -p mitigate-ci-fixture "$keychain"
          security default-keychain -d user -s "$keychain"
          target/debug/mitigate-test-mcp secret-contract target/debug/mitigate
          python scripts/verify-policy.py target/debug/mitigate --native
          # Keychain ACLs trust the creating application. Keep the receipt fixture
          # in its own binary; the following CLI fixture creates its own entries.
          cargo run -p mitigate-enrollment --features https --example native_lifecycle --locked -- --allow-native-fixture --capture-cli target/debug/mitigate
          node scripts/verify-enrollment-cli.mjs target/debug/mitigate
      - name: Verify native credentials on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus-x11 gnome-keyring
          export XDG_DATA_HOME="$RUNNER_TEMP/mitigate-keyring-fixture"
          mkdir -p "$XDG_DATA_HOME"
          dbus-run-session -- bash scripts/verify-linux-secrets.sh
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - run: cargo install cargo-deny --version 0.19.0 --locked
      - run: cargo deny --all-features check licenses bans sources
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and history
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all"
