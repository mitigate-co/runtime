[workspace]
resolver = "3"
members = ["crates/mitigate-cli", "crates/mitigate-config", "crates/mitigate-mcp-scan", "crates/mitigate-json", "crates/mitigate-mcp", "crates/mitigate-fingerprint", "fixtures/mcp-server"]
default-members = ["crates/mitigate-cli"]
exclude = ["vendor/process-wrap"]

# Reviewed Windows cleanup correction; provenance and removal criteria in vendor/.
[patch.crates-io]
process-wrap = { path = "vendor/process-wrap" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/mitigate-co/runtime"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
url = "=2.5.8"
sha2 = "=0.10.9"
serde_json_canonicalizer = "=0.3.2"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "process", "io-util", "time", "macros", "signal"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
